<style>[hidden]{display:none!important}body{background:#15191e}#editor{width:328px}#editor select{width:100%}#editor .editorBody{max-height:920px}.stage{position:absolute;left:360px;right:30px;top:100px;height:820px}.wheel{position:absolute;width:650px;left:200px;top:180px}.pedal{position:absolute;top:230px;height:370px;width:34px;border:5px solid #080d12;border-radius:15px;background:#27313b}.pedal:before{position:absolute;top:-45px;color:#edf5ff;font:bold 26px sans-serif;white-space:nowrap}.brake{left:120px}.brake:before{content:'刹车'}.throttle{left:880px}.throttle:before{content:'油门'}.rails{position:absolute;left:200px;top:80px;display:flex;gap:100px}.rail{width:260px;height:14px;border:2px solid #73879d;border-radius:4px}.dash{position:absolute;left:405px;top:128px;width:260px;height:83px;background:#111923;display:flex;align-items:center;justify-content:space-around;font:600 30px Consolas;color:#edf5ff;border-bottom:4px solid #ff5673}.legend{position:fixed;right:18px;top:15px;color:#a4b7cc;font:13px sans-serif}.lamp{position:absolute;width:7px;height:7px;border-radius:50%;background:#8dcdb8}.mapping{display:block}.mapping .entry{margin:8px 0}.mapping .entry label{display:block}.mapping .entry input{width:100%;font:12px Consolas}.popup{position:absolute;z-index:50;background:#1c2938;border:1px solid #62d9ff;left:24px;top:265px;width:290px;color:#edf5ff}.popup div{padding:8px 10px}.popup .active{background:#2c4258}.faceLights{position:absolute;left:200px;top:180px;width:650px;height:592px;pointer-events:none}.mapping label{font-size:12px}#wheelStatus{min-height:30px}</style>
<aside id="editor"><header><div><strong>布局编辑</strong><span>拖动标题移动面板</span></div><button>−</button></header><div class="editorBody"><div class="toolbar"><button>↶ 撤销</button><button>↷ 重做</button><button>全选</button></div><p class="hint">点击选中 · Shift 加选 · 空白处框选<br>方向键微调 · Shift 加速 · 拖右下角等比缩放</p><details open><summary>方向盘盘面</summary><label>可选盘面 <select id="faces"><option>原款方向盘 · 已内置</option><option>SIMAGIC GT Pro 圆盘 · 已下载</option></select></label><div class="toolbar"><button id="download">下载所选盘面</button></div><p id="wheelStatus" class="hint"></p><label>仪表显示 <select id="mode"><option>跟随盘面（有屏才显示）</option><option>独立显示，可单独移动</option><option>隐藏仪表</option></select></label><details id="maps"><summary>此盘面的按键映射</summary><p class="hint">已载入速魔厂设编号；在SimPro改过编号时可单独覆盖。</p><div class="mapping" id="mapping"></div></details></details><div class="sectionTitle">模块 <span>选择 / 显示 / 锁定</span></div><div id="modules"></div><div class="sectionTitle">未选择模块</div><div class="pair"><label>X<input value="0"></label><label>Y<input value="0"></label></div><div class="pair"><label>宽<input value="640"></label><label>高<input value="640"></label></div><div class="toolbar"><button>复位所选</button><button>移动整体</button><button>移回屏内</button></div><button class="primary">完成并保存 <span>Ctrl+Alt+M</span></button></div></aside>

<script>
const state=new URLSearchParams(location.search).get('state')||'D02',selected=!['D01','D05'].includes(state),wheel=document.querySelector('#wheel');wheel.src=selected?'../../../wheel-packs/simagic-gt-pro-round/wheel.png':'../../../assets/wheel.png';document.querySelector('#faces').selectedIndex=1;if(!selected)document.querySelector('#faces').options[1].textContent='SIMAGIC GT Pro 圆盘 · 可下载';document.querySelector('#mode').selectedIndex=state==='D04'?1:0;document.querySelector('#dash').hidden=state!=='D04';document.querySelector('#download').disabled=selected;document.querySelector('#wheelStatus').textContent=state==='D05'?'当前：原款方向盘。新圆盘下载失败，可点击重试':selected?'SIMAGIC GT Pro 圆盘 · 已选择':'当前：原款方向盘。待下载：SIMAGIC GT Pro 圆盘';if(state==='D05')document.querySelector('#wheelStatus').classList.add('error');document.querySelector('#maps').open=state==='D03';document.querySelector('#legend').textContent='盘面v2设计 · '+state+' · 1440×1000 CSS px';for(const name of ['方向盘盘面','刹车与辅助','油门与辅助','左前轮滑移','右前轮滑移','独立仪表']){const row=document.createElement('div');row.className='module';row.innerHTML='<label><input type="checkbox"><span>'+name+'</span></label><button>显示</button><button>解锁</button>';document.querySelector('#modules').append(row);}for(const c of [...designFace.controls,...designFace.encoders]){const entry=document.createElement('div');entry.className='entry';const label=document.createElement('label');label.textContent=c.label;const input=document.createElement('input');input.value=c.b.join(',');entry.append(label,input);document.querySelector('#mapping').append(entry);}if(selected){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('faceLights');svg.setAttribute('viewBox','0 0 1315 1197');for(const [i,shape] of designFace.ledShapes.entries()){const p=document.createElementNS(svg.namespaceURI,'polygon');p.setAttribute('points',shape.points.map(p=>p.join(',')).join(' '));p.setAttribute('fill',i>6?'#ebc777':'#8dcdb8');svg.append(p);}for(const e of designFace.encoders.filter(e=>e.lightPoints)){const p=document.createElementNS(svg.namespaceURI,'polygon');p.setAttribute('points',e.lightPoints.map(p=>p.join(',')).join(' '));p.setAttribute('fill','#91bfe6');p.setAttribute('opacity','.38');svg.append(p);}document.querySelector('.stage').append(svg);}if(state==='D06'){const popup=document.createElement('div');popup.className='popup';popup.innerHTML='<div>原款方向盘 · 已内置</div><div class="active">✓ SIMAGIC GT Pro 圆盘 · 已下载</div>';document.querySelector('#editor').append(popup);const r=document.querySelector('#faces').getBoundingClientRect(),b=document.querySelector('#editor').getBoundingClientRect();popup.style.left=(r.left-b.left)+'px';popup.style.top=(r.bottom-b.top)+'px';popup.style.width=r.width+'px';}
</script>
