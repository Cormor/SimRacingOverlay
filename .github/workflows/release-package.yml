name: Package Windows release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download unchanged runtime from verified base release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/base
          gh release download v1.0.1 --pattern SimRacingOverlay-1.0.1-Windows-x64.zip --dir build/base
          python3 tools/runtime_from_release.py build/base/SimRacingOverlay-1.0.1-Windows-x64.zip a7e5825666aef4ba2bf07112e89ea5a9bb8612cf8d1cbb74a8f748baeca9bea1
      - name: Package sources and runtime
        run: python3 tools/package.py
      - name: Upload complete package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 tools/upload_release.py
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
