name: Package Windows release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download unchanged runtime from verified base release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/base | Out-Null
          gh release download v1.0.1 --pattern SimRacingOverlay-1.0.1-Windows-x64.zip --dir build/base
          python tools/runtime_from_release.py build/base/SimRacingOverlay-1.0.1-Windows-x64.zip a7e5825666aef4ba2bf07112e89ea5a9bb8612cf8d1cbb74a8f748baeca9bea1 --rebuild-native
      - name: Build current native bridge and launcher
        run: ./tools/build.ps1
      - name: Verify layout and algorithms
        run: |
          node src/test_relative_layout.js
          node src/verify_algorithm_baseline.js
          ./tools/test-telemetry.ps1
      - name: Package sources and runtime
        run: python tools/package.py
      - name: Upload complete package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python tools/upload_release.py
          Get-Content dist/SHA256SUMS.txt | Add-Content $env:GITHUB_STEP_SUMMARY
