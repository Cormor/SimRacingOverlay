<!doctype html>
<html lang="zh-CN" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimRacingOverlay · 设备输入</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="ui-foundation.css">
<!-- Vendor: SoftwareCompany/design/materials.css 2.3; semantic fill and local physical ring cache. -->
<link rel="stylesheet" href="ui-materials.css">
<link rel="stylesheet" href="manager.css">
<link rel="stylesheet" href="setup-interaction.css">
<body class="settings-embedded device-setup">
<main class="settings-shell device-shell">
 <header class="device-heading"><h1>设备输入</h1><p class="muted">绑定设置保存后生效。</p></header>
 <div class="device-content" id="deviceContent">
  <section class="lx-surface card" aria-labelledby="connectionTitle">
   <h2 id="connectionTitle">当前输入</h2>
   <p id="devices">正在读取设备…</p>
   <dl id="live" class="live-inputs" aria-live="off">
    <div><dt>方向</dt><dd><output id="live-steering" aria-live="off">—</output><span id="source-steering" class="muted"></span></dd></div>
    <div><dt>油门</dt><dd><output id="live-throttle" aria-live="off">—</output><span id="source-throttle" class="muted"></span></dd></div>
    <div><dt>刹车</dt><dd><output id="live-brake" aria-live="off">—</output><span id="source-brake" class="muted"></span></dd></div>
    <div><dt>手刹</dt><dd><output id="live-handbrake" aria-live="off">—</output><span id="source-handbrake" class="muted"></span></dd></div>
   </dl>
  </section>
  <section class="lx-surface card" aria-labelledby="bindingsTitle">
   <h2 id="bindingsTitle">轴绑定</h2>
   <p class="muted" id="learningHelp">学习时只操作对应的轴：转向左右打到实际两端；踏板或手刹先松开，再操作到满行程。采用后请保存，取消保留原绑定。多个同型号设备换USB后需重新确认。</p>
   <label class="lx-field steering-range"><span>总转向角 · °</span><input class="lx-input" id="range" type="number" min="180" max="2520" step="10" value="900" aria-describedby="rangeHelp"><small id="rangeHelp">与驱动中的角度一致；范围180–2520°。</small></label>
   <div id="axes" aria-describedby="learningHelp"></div>
  </section>
  <section class="lx-surface card advanced-device">
   <button id="legacyToggle" class="lx-disclosure" aria-expanded="false" aria-controls="legacyContent"><span data-icon="chevron" aria-hidden="true"></span>通用按键布局（旧版）</button>
   <div id="legacyContent" hidden>
    <p class="muted">此布局使用18个通用位置，与盘面页的按键映射分别保存。选择位置后，点击“学习按键”并按下设备按钮。</p>
    <div class="row"><label>通用位置</label><div id="slotSelect" class="select-holder"></div><button id="learnButton" class="lx-button lx-material-edge-on-hover lx-material-glow-on-hover">学习按键</button><button id="cancelButton" class="lx-button lx-material-edge-on-hover lx-material-glow-on-hover" hidden>取消学习</button><button id="clearButton" class="lx-button lx-material-edge-on-hover lx-material-glow-on-hover">清除此位置</button></div>
    <output id="buttonResult" class="mono"></output>
   </div>
  </section>
  <section class="lx-surface card advanced-device">
   <button id="lightsToggle" class="lx-disclosure" aria-expanded="false" aria-controls="lightsContent"><span data-icon="chevron" aria-hidden="true"></span>MOZA灯色观察</button>
   <div id="lightsContent" hidden>
    <label class="check-row"><input id="led" type="checkbox">启用灯色观察</label>
    <p class="muted">只读取已运行的Pit House／SimHub灯光输出，不控制硬件。只支持已识别的MOZA协议；其他设备使用软件转速灯效。保存后在关联启动时应用。</p>
   </div>
  </section>
 </div>
 <footer class="device-save-bar" id="deviceSaveBar">
  <div class="device-save-state"><p id="dirtyState" class="muted" role="status" aria-live="polite" hidden></p><p id="message" class="lx-status" role="status" tabindex="-1" hidden></p></div>
  <button id="retryConfig" class="lx-button lx-material-edge-on-hover lx-material-glow-on-hover" hidden>重试读取设置</button>
  <button id="save" class="lx-button lx-button--primary lx-material-gold lx-material-glow-on-hover" disabled>保存设备设置</button>
 </footer>
</main>
<script src="ui-controls.js"></script>
<script src="setup.js"></script>
</body></html>
